<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    background: #f4f7fa; /* The premium off-white sidebar color */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  .brand {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: #ffffff; /* Inner sunken plate is pure white to match JPG */
    border-radius: 20px;
    border: 8px solid #f4f7fa; /* Thick border matches body to create frame */
    box-shadow: 
      8px 8px 16px #d5dce4, 
      -8px -8px 16px #ffffff,
      inset 4px 4px 8px rgba(0, 0, 0, 0.05); /* Sunken inner shadow */
    overflow: hidden; /* Hide scaled whitespace */
  }
  .brand::after {
    content: "";
    position: absolute;
    bottom: -24px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: linear-gradient(90deg, #14b8a6, #f59e0b, #14b8a6);
    background-size: 200% 100%;
    animation: gradientPan 3s ease infinite;
    border-radius: 2px;
  }
  .brand-logo {
    width: 100%;
    height: auto;
    object-fit: contain;
    transform: scale(1.8); /* Zoom in to crop out whitespace and fill frame */
  }
  @keyframes gradientPan{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
</style>
</head>
<body>
  <div style="width: 300px;">
    <div class="brand">

    </div>
  </div>
</body>
</html>
